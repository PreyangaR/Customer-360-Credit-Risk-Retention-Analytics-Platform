version: 2

models:
  - name: int_customer_core
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: customer_type_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customer_types')
              field: customer_type_id

      - name: address_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_addresses')
              field: address_id


  - name: int_customer_accounts
    columns:
      - name: account_id
        tests:
          - not_null
          - unique

      - name: customer_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_customers')
              field: customer_id

      - name: account_type_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_account_types')
              field: account_type_id

      - name: account_status_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_account_statuses')
              field: account_status_id


  - name: int_customer_loans
    columns:
      - name: loan_id
        tests:
          - not_null
          - unique

      - name: account_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_accounts')
              field: account_id

      - name: loan_status_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_loan_statuses')
              field: loan_status_id


  - name: int_customer_transactions
    columns:
      - name: transaction_id
        tests:
          - not_null
          - unique

      - name: origin_account_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_accounts')
              field: account_id

      - name: destination_account_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_accounts')
              field: account_id

      - name: transaction_type_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_transaction_types')
              field: transaction_type_id

      - name: branch_id
        tests:
          - not_null
          - relationships:
              to: ref('stg_branches')
              field: branch_id

  

  - name: int_churn_customer
    columns:
      - name: customer_id
        tests:
          - not_null
          - unique

      - name: churn
        tests:
          - not_null
          - accepted_values:
              values: [0, 1]

     